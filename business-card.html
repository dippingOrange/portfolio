<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /*
        在style标签内可以用 "/*" 来写注释，而在style标签外则必须按照HTML格式要求，用<!--注释内容-->来写注释
        */
    </style>
    <!--style标签外的正确注释形式,HTML的注释不支持嵌套！-->
    <title>个人名片</title>
    <style>
        /* ========================================
           第一步：CSS 变量 —— 你的设计系统
           把所有颜色、间距定义在这里，后面直接引用。
           修改这一块，整个页面的风格就变了。
           ======================================== */
        :root {
            --bg:        #7f868f;     /* 页面背景色 */
            --card-bg:   #4a4963;     /* 卡片背景色 */
            --primary:   #4f46e5;     /* 主色 —— 按钮、强调元素 */
            --primary-light: #eef2ff; /* 主色的浅色版 —— 标签背景 */
            --text:      #1e293b;     /* 正文颜色 */
            --text-muted:#64748b;     /* 次要文字 */
            --border:    #e2e8f0;     /* 边框颜色 */
            --radius:    16px;        /* 圆角 */
            --shadow:    0 10px 15px 10px rgba(0,0,0,0.2),/*rgba中的四个数字，前三个是三原色（红绿蓝）的显示亮度，值域在0-255，0即为无红色，255为该颜色最亮；第四位数字是不透明度，1为100%*/
                         0 4px 16px 0px rgba(0,0,0,0.06);  /* 双层阴影更自然 */
            --gap:       16px;        /* 统一间距 */
        }
        

        /* ========================================
           第二步：基础重置
           *{} 是CSS的通配选择器，选择页面上所有的元素
           不同的浏览器会有其特定的默认样式，这些样式设
           置了不同的外边距、字号等参数，如果不编辑直接
           写会很乱，因此用*{}把默认值清零，让一切从0开始
           ======================================== */
        * {
            margin: 10;
            padding: 10;
            box-sizing: border-box;  /* padding 和 border 算在 width 里面 */
        }
        /*
        width只覆盖content区域，而padding和border是额外加上去的，
        上方通配选择器的作用是让width设置的值变为包含了broder+padding+content整个范围的值
        padding和broder的值从content中扣
        */

        body {
            /*和<body></body>是同一个东西
            CSS中通过body选中它来增加样式
            var(--引用元素名)，来引用已经设置好的基本参数——颜色、宽度等
            */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,/*整个页面的默认字体*/
                         "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
            background: var(--bg);  /*整个页面的默认背景→灰色 最后面的(--bg) 就是在:root中定义的;*/
            color: var(--text); /*整个页面的默认文字颜色*/
            line-height: 1.6; /*行高*/

            /* 三个 Flexbox 属性实现居中（记下来，这是最常用的组合） */
            display: flex;
            justify-content: center;  /* 水平居中 */
            align-items: center;      /* 垂直居中 */
            min-height: 100vh;        /* 最少占满整个屏幕高度 */
            /*若不引入这些属性，卡片会黏在左上角
            HTML默认流就是从左上开始排列
            */
        }

        /* ========================================
           第三步：卡片主体
           ======================================== */
        .card {
            background: var(--card-bg); /*引用:root中设定好的card-bg，卡片背景颜色*/
            border-radius: var(--radius); /*引用:root中设定号的圆角格式*/
            box-shadow: var(--shadow);/*引用:root中设定好的双重叠加阴影*/
            padding: 40px; /*内容到边框的距离为40个像素点*/

            /* 卡片最大宽度 420px，屏幕小时自动缩小 */
            width: 70%; /*占父元素body宽度的90%，跟随屏幕缩小*/
            max-width: 520px; /*设置宽度上限*/
        }

        /* ========================================
           第四步：头像区域
           ======================================== */
        .card-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;   /* 50% 圆角 = 圆形 */
            background: linear-gradient(0deg, #4f46e5, #b08bef);  /* 渐变背景 ，135deg为从左上到右下，0deg是下往上，顺时针旋转了135°*/
            color: white;
            font-size: 32px;/*weight设置字体粗细*/
            font-weight: 900;

            /* Flexbox 居中文字 */
            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 30px;
        }

        /* ========================================
           第五步：名字和头衔
           ======================================== */
        .card-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .card-title {
            color: var(--primary);
            font-size: 20px;
            font-weight: 100;
            margin-bottom: 20px;
            margin-top: 30px;
        }
        /*
        margin折叠：CSS的有意设计，防止段落之间的距离翻倍，当只有两个值不相等时，才能看到差值
        margin折叠不是相加，而是取最大值_max(10,30)=30，合理用法是只修改上方或下方的margin
        如果想要关闭折叠功能，可以将父容器设置为FLEX容器，或在父容器上阻止折叠
        */

        /* ========================================
           第六步：简介文字
           ======================================== */
        .card-bio {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.0; /*设置行距*/
            margin-bottom: 20px;
            margin-top: 20px;
        }

        /* ========================================
           第七步：分割线
           分割线对应的HTML是<hr class="divider">，但默认分割线的风格很丑
           因此，对其进行初始化与改造，使用border:none 去掉其默认的立体边框
           用height设置线的高度，用background纯色填充
           画线的思路：
           1.用border画：
           使用边框顶部画，border-top:1px solid #color
           2.用背景画：(示例使用的方法)
           border:none; 关闭所有边框
           height:1px; 高度设置
           background.... 背景色填充

           ======================================== */
        .divider {
            border: none;
            height: 1px;
            background: var(--border);
            margin-bottom: 20px;
        }

        /* 思路一：用 border 画分割线（对比上面的思路二）
            solid：实线
            dashed：虚线
            dotted：点线
            border-top 上边
            border-bottom  下边
            border-left  左边
            border-right  右边
        */
        .divider-border {
            border: none;                  /* 去掉默认立体边框 */
            border-top: 1px solid var(--border);  /* 线画在边框顶部——只对边框上沿填色 */
            margin-bottom: 20px;
        }

        /* ========================================
           第八步：技能标签（Flexbox 自动换行）
           ======================================== */
        .skills {
            display: flex; /*弹性布局，子元素排成一行*/
            flex-wrap: wrap;   /* 标签太多时自动换行，若不用这个功能，标签过高会挤爆容器 */
            gap: 5px;          /* 标签之间的间距（现代写法，替代 margin） */
            margin-bottom: 24px;
        }

        .skill-tag {
            background: var(--primary-light);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;  /* 大圆角 = 胶囊形状 */
            font-size: 13px;
            font-weight: 500;
        }

        /* ========================================
           第九步：联系按钮
           ======================================== */
        .btn-contact {
            display: block; /*独占一行*/
            width: 100%; /*撑满父容器宽度,不仅可以用px，也可以用百分比*/
            padding: 12px 0; /*上下12px，左右0*/
            background: var(--primary); /*紫色背景*/
            color: white;
            border: none; /*去掉按钮默认边框*/
            border-radius: 10px; /*圆角*/
            font-size: 15px;
            font-weight: 600; /*半粗*/
            cursor: pointer; /*鼠标移动到按钮上会变成“手”形*/

            /* 过渡动画 —— 鼠标悬停时平滑变化 */
            transition: all 0.2s ease;
        }


        /*
        定义写在.btn-contact:hover 里的属性，就是一个新的值，不是叠加。
        默认状态的全部属性依然生效，hover里只写了要变的那几条
        */
        .btn-contact:hover {
            background: #4338ca;           /* 颜色变深 */
            transform: translateY(-2px);   /* 往上飘 2px */
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.5); /*设置不透明度，从左到右依次是：水平偏移、垂直偏移、模糊半径、扩散半径、颜色(rgba)*/
        }

        /* 点击瞬间的反馈 */
        .btn-contact:active {
            transform: translateY(0);      /* 回到原位 */
        }
    </style>
</head>
<body>

    <!--
    整个页面就这一块 HTML。结构非常平：
    所有内容都在 .card 里，从上到下依次排列。
    没有复杂的嵌套，就是自然的信息流。
    -->
    <div class="card">

        <!-- 头像：用首字母代替图片 -->
        <div class="card-avatar">郑</div>

        <!-- 姓名 + 头衔 -->
        <h1 class="card-name">郑富彬</h1>
        <p class="card-title">前端开发工程师</p>

        <div class="card-avatar">富</div>

        <!-- 简介 -->
        <p class="card-bio">
            热爱用代码构建优雅的用户界面。
            2 年 Web 开发经验，擅长 Python 后端与前端技术的结合，
            致力于写出可维护、好看且好用的产品。
        </p>

        <hr class="divider">

        <!-- 技能标签 -->
        <div class="skills">
            <span class="skill-tag">Python</span>
            <span class="skill-tag">FastAPI</span>
            <span class="skill-tag">HTML & CSS</span>
            <span class="skill-tag">JavaScript</span>
            <span class="skill-tag">Vue.js</span>
            <span class="skill-tag">MySQL</span>
            <span class="skill-tag">机器学习</span>
            <span class="skill-tag">AgentSFT</span>
        </div>
    
        <hr class="divider">

        <div class="skills">
            <span class="skill-tag">JavaScript</span>
            <span class="skill-tag">HTML5</span>
        </div>    
        <!-- 思路一：用 border 画的线 -->
        <hr class="divider-border">

        <!-- 联系按钮 -->
        <button class="btn-contact">联系我</button>

    </div>

</body>
</html>
